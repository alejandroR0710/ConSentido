# Despliegue automático al hosting (cPanel) en cada push a la rama hosting-mysql.
# Compila backend + frontend, sube la carpeta por FTP y la app se reinicia
# sola (tmp/restart.txt). Secretos necesarios: ver HOSTING.md → "Despliegue automático".
name: Desplegar al hosting

on:
  push:
    branches: [hosting-mysql]
  workflow_dispatch: # botón "Run workflow" para desplegar a mano

concurrency:
  group: desplegar-hosting
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Compilar y armar la carpeta del hosting
        working-directory: backend
        env:
          SIN_ZIP: "1"
          VITE_EXTERNAL_LEAD_API_KEY: ${{ secrets.VITE_EXTERNAL_LEAD_API_KEY }}
        run: node scripts/empaquetar-hosting.js

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./hosting/sistemapos/
          server-dir: ./
          # uploads/ tiene las fotos que suben los usuarios: nunca se toca.
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**
            node_modules/**
