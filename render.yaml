services:
  - type: web
    name: consentido-backend
    runtime: node
    rootDir: backend
    # --include=dev es necesario: con NODE_ENV=production puesto, "npm install"
    # se salta devDependencies por defecto — pero typescript y los @types/* (que
    # hacen falta para compilar) viven ahí, no en dependencies.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_HOURS
        value: 10
      - key: CORS_ORIGIN
        sync: false
