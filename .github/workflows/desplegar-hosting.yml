name: Desplegar al hosting (InterServer / DirectAdmin)

# Mismo esquema que EComerceConsentido: compila en GitHub (el hosting
# compartido tiene pocos procesos disponibles), sube lo ya construido por
# SSH/rsync y reinicia la app tocando tmp/restart.txt (Passenger). Las
# dependencias nuevas se instalan a mano (Run NPM Install): el hosting no da
# hilos suficientes para correr npm desde aquí.
#
# Requiere estos Secrets del repositorio (Settings -> Secrets and variables -> Actions):
#   SSH_HOST                    hostname del hosting        (el mismo de EComerceConsentido)
#   SSH_PORT                    puerto SSH                  (22)
#   SSH_USER                    usuario del hosting         (consenti)
#   SSH_PRIVATE_KEY             clave privada de despliegue (la misma de EComerceConsentido sirve)
#   VITE_EXTERNAL_LEAD_API_KEY  clave del bot de leads (la de frontend/.env)
#
# Los cambios de base de datos NO se aplican aquí: se corren a mano en phpMyAdmin.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar-hosting
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Compilar (backend + frontend con VITE_API_URL=/api/v1)
        working-directory: backend
        env:
          SIN_ZIP: "1"
          VITE_EXTERNAL_LEAD_API_KEY: ${{ secrets.VITE_EXTERNAL_LEAD_API_KEY }}
        run: node scripts/empaquetar-hosting.js

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Subir al servidor
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -eux
          cd hosting/sistemapos
          # dist/ y public/ se reemplazan completos. uploads/ (fotos de los
          # usuarios) y node_modules/ del servidor nunca se tocan.
          rsync -az --delete -e "$SSH" dist/ "$REMOTE:sistemapos/dist/"
          rsync -az --delete -e "$SSH" public/ "$REMOTE:sistemapos/public/"
          # -i lista lo que cambió: si cambió package-lock.json hay que instalar
          # dependencias a mano. En este hosting (13 hilos por cuenta) npm install
          # no puede correr desde aquí, igual que en EComerceConsentido.
          CAMBIOS=$(rsync -az -i -e "$SSH" package.json package-lock.json "$REMOTE:sistemapos/")
          if echo "$CAMBIOS" | grep -q "package-lock.json"; then
            echo "::warning::Cambiaron las dependencias: en DirectAdmin → Setup Node.js App → Run NPM Install → Restart"
          fi

      - name: Reiniciar la app (Passenger)
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          $SSH "$REMOTE" 'mkdir -p ~/sistemapos/tmp && touch ~/sistemapos/tmp/restart.txt'

      - name: Verificar que responde
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://sistemapos.consentidovelas.com/health | grep -q '"status":"ok"'; then
              echo "OK (intento $i)"; exit 0
            fi
            echo "esperando arranque... ($i)"; sleep 10
          done
          echo "No respondió OK tras 2 minutos"; exit 1
